name: Feature request
description: Предложить улучшение или новый режим
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Задача
      description: Какую проблему это решит?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предложение
      description: Как это могло бы работать (режим, команда, конфиг)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
    validations:
      required: false
