name: codeql

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, community, releases ]
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (c-cpp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
