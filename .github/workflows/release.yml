name: release

on:
  pull_request:
    branches: [ releases ]
  push:
    branches: [ releases ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  check:
    name: check release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check version and tag
        id: v
        run: |
          if [ ! -f VERSION ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No VERSION file, nothing to release"
            exit 0
          fi
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$version already exists, skipping release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$version is missing: the release will be published when this branch is pushed"
          fi

  release:
    name: publish release
    needs: [ tests, check ]
    if: github.event_name == 'push' && needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download firmware (esp32)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware-esp32
          path: fw/esp32

      - name: Download firmware (esp32s3)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware-esp32s3
          path: fw/esp32s3

      - name: Download firmware (esp32c3)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware-esp32c3
          path: fw/esp32c3

      - name: Download firmware (esp32, no bot)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware-esp32-nobot
          path: fw/esp32-nobot

      - name: Create merged images
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for tgt in ("esp32", "esp32s3", "esp32c3", "esp32-nobot"):
              d = Path("fw") / tgt
              entries = []
              for line in (d / "flash_args").read_text().splitlines():
                  parts = line.split()
                  if len(parts) == 2 and parts[0].startswith("0x"):
                      entries.append((int(parts[0], 16), d / parts[1]))
              entries.sort()
              out = bytearray()
              for off, path in entries:
                  if len(out) > off:
                      raise SystemExit(f"{tgt}: overlapping segments at {off:#x}")
                  out += b"\xff" * (off - len(out))
                  out += path.read_bytes()
              (Path("fw") / f"esp32-zapret-{tgt}-merged.bin").write_bytes(out)
              print(f"{tgt}: merged {len(out)} bytes from {len(entries)} segments")
          PY

      - name: Assemble release archive
        run: |
          set -euo pipefail
          pkg="pkg/esp32-zapret"
          mkdir -p "$pkg/firmware"
          for f in main components tests tools docs README.md README.en.md INSTALL_RU.md CHANGELOG.md DISCLAIMER.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md LICENSE VERSION CMakeLists.txt sdkconfig.defaults sdkconfig.defaults.esp32c3 sdkconfig.defaults.esp32s3 .gitignore .gitattributes; do
            cp -r "$f" "$pkg/"
          done
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          chip = {
              "esp32": "esp32",
              "esp32s3": "esp32s3",
              "esp32c3": "esp32c3",
              "esp32-nobot": "esp32",
          }
          firmware = Path("pkg/esp32-zapret/firmware")
          for tgt, chip_name in chip.items():
              src = Path("fw") / tgt
              dst = firmware / tgt
              dst.mkdir(parents=True, exist_ok=True)
              pairs = []
              for line in (src / "flash_args").read_text().splitlines():
                  parts = line.split()
                  if len(parts) == 2 and parts[0].startswith("0x"):
                      name = Path(parts[1]).name
                      shutil.copy(src / parts[1], dst / name)
                      pairs.append(f"{parts[0]} {name}")
              shutil.copy(Path("fw") / f"esp32-zapret-{tgt}-merged.bin", dst / "esp32-zapret-merged.bin")
              bat = [
                  "@echo off\r\n",
                  "setlocal\r\n",
                  "set PORT=%~1\r\n",
                  'if "%PORT%"=="" set PORT=COM3\r\n',
                  "set ESPTOOL=esptool\r\n",
                  "%ESPTOOL% version >nul 2>nul\r\n",
                  "if errorlevel 1 set ESPTOOL=esptool.py\r\n",
                  "%ESPTOOL% version >nul 2>nul\r\n",
                  "if errorlevel 1 (\r\n",
                  "  echo [!] esptool not found. Install: pip install esptool\r\n",
                  "  echo [!] Or flash esp32-zapret-merged.bin at 0x0 with any ESP flash tool.\r\n",
                  "  pause\r\n",
                  "  exit /b 1\r\n",
                  ")\r\n",
                  f"echo Flashing esp32-zapret ({tgt}) to %PORT% ...\r\n",
                  f"%ESPTOOL% --chip {chip_name} --port %PORT% --baud 460800 write_flash --flash_mode dio --flash_size 4MB {' '.join(pairs)}\r\n",
                  "pause\r\n",
              ]
              (dst / "flash.bat").write_bytes("".join(bat).encode("ascii"))
              print(f"{tgt}: packaged")
          PY
          {
            printf 'esp32-zapret firmware (v%s)\n' "$VERSION"
            printf 'Built by GitHub Actions from tag v%s.\n\n' "$VERSION"
            printf 'FIRST BOOT: the device starts a setup access point:\n'
            printf '  SSID:     esp32-zapret-XXXX (XXXX from the MAC)\n'
            printf '  password: zapret12345 (CONFIG_APP_WEB_PASSWORD)\n'
            printf 'Connect to it and open http://192.168.4.1 to set Wi-Fi, the bot\n'
            printf 'token and the Wake-on-LAN target. No ESP-IDF install needed.\n'
            printf 'Change the web/setup password during provisioning.\n\n'
            printf 'Variants:\n'
            printf '  esp32/        - ESP32 (WROOM-32), Telegram bot\n'
            printf '  esp32s3/      - ESP32-S3, Telegram bot\n'
            printf '  esp32c3/      - ESP32-C3, Telegram bot\n'
            printf '  esp32-nobot/  - ESP32, no Telegram bot (periodic TLS self-test)\n\n'
            printf 'Each directory contains the individual binaries and a flash.bat.\n'
            printf 'Flash esp32-zapret-merged.bin at 0x0 with any ESP flash tool\n'
            printf '(esptool, Flash Download Tool, ESP Web Tools) or run flash.bat.\n'
          } > "$pkg/firmware/README.txt"
          (cd pkg && zip -r "../esp32-zapret-v${VERSION}.zip" esp32-zapret)

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            fw/esp32-zapret-esp32-merged.bin
            fw/esp32-zapret-esp32s3-merged.bin
            fw/esp32-zapret-esp32c3-merged.bin
            fw/esp32-zapret-esp32-nobot-merged.bin
            esp32-zapret-v${{ env.VERSION }}.zip

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v ver="$VERSION" 'BEGIN{f=0} /^## \[/{ if (f) exit; if (index($0, "[" ver "]")) f=1 } f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Release v${VERSION}" > notes.md
          fi
          printf '\n---\nFirmware variants: esp32, esp32s3, esp32c3, esp32 (no bot).\nOn first boot the device starts a setup access point (esp32-zapret-XXXX,\npassword zapret12345): connect and open http://192.168.4.1 to set Wi-Fi,\nthe bot token and the Wake-on-LAN target. No toolchain required.\n' >> notes.md

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "esp32-zapret v${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "esp32-zapret-v${VERSION}.intoto.jsonl"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file notes.md \
            "fw/esp32-zapret-esp32-merged.bin" \
            "fw/esp32-zapret-esp32s3-merged.bin" \
            "fw/esp32-zapret-esp32c3-merged.bin" \
            "fw/esp32-zapret-esp32-nobot-merged.bin" \
            "esp32-zapret-v${VERSION}.zip" \
            "esp32-zapret-v${VERSION}.intoto.jsonl"

  component:
    name: publish esp_desync
    needs: [ check, release ]
    if: github.event_name == 'push' && needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for the registry token
        id: token
        run: echo "present=${{ secrets.IDF_COMPONENT_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish esp_desync to the ESP Component Registry
        if: steps.token.outputs.present == 'true'
        uses: espressif/upload-components-ci-action@355b0bb4d41e94edbec03d08c0ba0c11bbc4834d # v2
        with:
          components: components/esp_desync
          namespace: fairen8
          version: ${{ needs.check.outputs.version }}
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
