name: release

on:
  pull_request:
    branches: [ releases ]
  push:
    branches: [ releases ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  check:
    name: check release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check version and tag
        id: v
        run: |
          if [ ! -f VERSION ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No VERSION file, nothing to release"
            exit 0
          fi
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$version already exists, skipping release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish v$version after approval"
          fi

  release:
    name: publish release
    needs: [ tests, check ]
    if: github.event_name == 'push' && needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download firmware
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware-bins
          path: firmware

      - name: Create merged image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          entries = []
          for line in Path("firmware/flash_args").read_text().splitlines():
              parts = line.split()
              if len(parts) == 2 and parts[0].startswith("0x"):
                  entries.append((int(parts[0], 16), Path("firmware") / parts[1]))
          entries.sort()
          out = bytearray()
          for off, path in entries:
              if len(out) > off:
                  raise SystemExit(f"overlapping segments at {off:#x}")
              out += b"\xff" * (off - len(out))
              out += path.read_bytes()
          Path("firmware/esp32-zapret-merged.bin").write_bytes(out)
          print(f"merged {len(out)} bytes from {len(entries)} segments")
          PY

      - name: Assemble release archive
        run: |
          set -euo pipefail
          pkg="pkg/esp32-zapret"
          mkdir -p "$pkg/firmware"
          for f in main components tests tools README.md README.en.md INSTALL_RU.md CHANGELOG.md DISCLAIMER.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md LICENSE VERSION CMakeLists.txt sdkconfig.defaults .gitignore .gitattributes; do
            cp -r "$f" "$pkg/"
          done
          cp firmware/bootloader/bootloader.bin firmware/partition_table/partition-table.bin firmware/esp32-zapret.bin firmware/esp32-zapret-merged.bin "$pkg/firmware/"
          {
            printf 'esp32-zapret firmware (v%s)\n' "$VERSION"
            printf 'Built by GitHub Actions from tag v%s.\n\n' "$VERSION"
            printf 'WARNING: this build uses placeholder credentials (empty Wi-Fi/token).\n'
            printf 'Build from source with your own main/secrets.h for real use - see INSTALL_RU.md.\n\n'
            printf 'Files:\n'
            printf '  bootloader.bin, partition-table.bin, esp32-zapret.bin - for esptool/flash.bat\n'
            printf '  esp32-zapret-merged.bin - single image, flash at 0x0\n'
          } > "$pkg/firmware/README.txt"
          {
            printf '@echo off\r\n'
            printf 'setlocal\r\n'
            printf 'set PORT=%%~1\r\n'
            printf 'if "%%PORT%%"=="" set PORT=COM3\r\n'
            printf 'set ESPTOOL=esptool\r\n'
            printf '%%ESPTOOL%% version >nul 2>nul\r\n'
            printf 'if errorlevel 1 set ESPTOOL=esptool.py\r\n'
            printf '%%ESPTOOL%% version >nul 2>nul\r\n'
            printf 'if errorlevel 1 (\r\n'
            printf '  echo [!] esptool not found. Install: pip install esptool\r\n'
            printf '  echo [!] Or flash esp32-zapret-merged.bin at 0x0 with any ESP flash tool.\r\n'
            printf '  pause\r\n'
            printf '  exit /b 1\r\n'
            printf ')\r\n'
            printf 'echo Flashing esp32-zapret to %%PORT%% ...\r\n'
            printf '%%ESPTOOL%% --chip esp32 --port %%PORT%% --baud 460800 write_flash --flash_mode dio --flash_size 4MB 0x1000 bootloader.bin 0x8000 partition-table.bin 0x10000 esp32-zapret.bin\r\n'
            printf 'pause\r\n'
          } > "$pkg/firmware/flash.bat"
          (cd pkg && zip -r "../esp32-zapret-v${VERSION}.zip" esp32-zapret)

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            firmware/esp32-zapret-merged.bin
            esp32-zapret-v${{ env.VERSION }}.zip

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v ver="$VERSION" 'BEGIN{f=0} /^## \[/{ if (f) exit; if (index($0, "[" ver "]")) f=1 } f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Release v${VERSION}" > notes.md
          fi
          printf '\n---\nRelease firmware assets are built with placeholder credentials.\nBuild from source with your own secrets.h for real use (see INSTALL_RU.md).\n' >> notes.md

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "esp32-zapret v${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "esp32-zapret-v${VERSION}.intoto.jsonl"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file notes.md \
            "firmware/esp32-zapret-merged.bin" \
            "esp32-zapret-v${VERSION}.zip" \
            "esp32-zapret-v${VERSION}.intoto.jsonl"
